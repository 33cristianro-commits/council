<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Tepuy · Doral</title>
<meta name="description" content="Venezuelan café in Doral, FL. Arepas, cachapas, café con leche. Demo website.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf6ef;
    --ink: #2a1d14;
    --muted: #6f5d50;
    --accent: #c4532b;
    --accent-dark: #9e3f1f;
    --card: #ffffff;
    --line: #eadfd2;
    --green: #2f5d50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; line-height: 1.1; }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  .demo-bar { background: var(--ink); color: #f3e9dd; font-size: 13px; text-align: center; padding: 8px 16px; }
  .demo-bar a { color: #ffb48f; }

  header { position: sticky; top: 0; z-index: 10; background: rgba(251,246,239,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  nav { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
  .logo { font-family: Fraunces, serif; font-weight: 800; font-size: 22px; text-decoration: none; }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 22px; font-size: 15px; font-weight: 500; }
  .nav-links a { text-decoration: none; color: var(--muted); }
  .nav-links a:hover { color: var(--ink); }
  .lang { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font: 600 13px Inter, sans-serif; cursor: pointer; }

  .hero { padding: 72px 0 56px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; }
  .eyebrow { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
  .hero h1 { font-size: clamp(40px, 6vw, 68px); margin: 12px 0 18px; }
  .hero p { color: var(--muted); font-size: 18px; max-width: 30em; }
  .ctas { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 14px 22px; border-radius: 12px; font-weight: 600; text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { border: 1.5px solid var(--ink); }
  .hero-art { aspect-ratio: 4/5; border-radius: 28px; background:
      radial-gradient(circle at 30% 30%, #f2b263 0 18%, transparent 19%),
      radial-gradient(circle at 68% 58%, #e9d3a6 0 22%, transparent 23%),
      radial-gradient(circle at 40% 78%, #c4532b 0 12%, transparent 13%),
      linear-gradient(160deg, #2f5d50, #1d3b33);
    position: relative; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(42,29,20,.5); }
  .hero-art .tag { position: absolute; left: 16px; bottom: 16px; right: 16px; background: rgba(255,255,255,.92); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
  .hero-art .tag strong { display: block; font-family: Fraunces, serif; font-size: 18px; }

  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 8px 0 64px; }
  .strip div { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .strip strong { display: block; font-size: 15px; }
  .strip span { color: var(--muted); font-size: 14px; }

  section { padding: 64px 0; }
  .section-head { margin-bottom: 32px; }
  .section-head h2 { font-size: clamp(30px, 4vw, 42px); }
  .section-head p { color: var(--muted); margin-top: 8px; }

  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .item .ph { aspect-ratio: 4/3; display: grid; place-items: center; font-size: 13px; color: rgba(255,255,255,.85); letter-spacing: .05em; }
  .item:nth-child(1) .ph { background: linear-gradient(135deg, #e7a649, #c4532b); }
  .item:nth-child(2) .ph { background: linear-gradient(135deg, #f0d48a, #d38b2f); }
  .item:nth-child(3) .ph { background: linear-gradient(135deg, #6b4a34, #2a1d14); }
  .item:nth-child(4) .ph { background: linear-gradient(135deg, #2f5d50, #1d3b33); }
  .item:nth-child(5) .ph { background: linear-gradient(135deg, #f5c6a5, #c4532b); }
  .item:nth-child(6) .ph { background: linear-gradient(135deg, #d9c3a0, #8a6a4b); }
  .item .body { padding: 16px 18px 20px; }
  .item h3 { font-size: 20px; display: flex; justify-content: space-between; gap: 8px; }
  .item h3 span { font-family: Inter, sans-serif; font-size: 16px; color: var(--accent); }
  .item p { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .about .quote { font-family: Fraunces, serif; font-size: 26px; line-height: 1.3; }
  .about p { color: var(--muted); margin-top: 16px; }

  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .review { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .stars { color: #e0a127; letter-spacing: 2px; }
  .review p { margin: 10px 0 12px; }
  .review span { color: var(--muted); font-size: 14px; }

  .visit { background: var(--green); color: #f3ede4; border-radius: 28px; padding: 44px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; }
  .visit h2 { font-size: clamp(30px, 4vw, 42px); }
  .visit p, .visit li { color: #d5e2dc; }
  .visit ul { list-style: none; margin-top: 16px; display: grid; gap: 6px; }
  .visit .btn-primary { margin-top: 24px; }
  .hours { background: rgba(255,255,255,.08); border-radius: 18px; padding: 22px; }
  .hours div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 15px; }
  .hours div:last-child { border-bottom: 0; }

  footer { padding: 40px 0 56px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  .float-cta { position: fixed; right: 16px; bottom: 16px; background: #25d366; color: #fff; font-weight: 600; text-decoration: none; padding: 12px 18px; border-radius: 999px; box-shadow: 0 10px 24px -8px rgba(0,0,0,.35); z-index: 20; }

  @media (max-width: 820px) {
    .nav-links { display: none; }
    .hero, .about, .visit { grid-template-columns: 1fr; }
    .hero { padding-top: 40px; gap: 32px; }
    .hero-art { aspect-ratio: 16/11; }
    .strip, .menu, .reviews { grid-template-columns: 1fr; }
    .visit { padding: 28px 20px; }
  }
</style>
</head>
<body>

<div class="demo-bar" data-en="Demo website by [Your Name] · Want one like this for your business? <a href='#visit'>Let's talk</a>" data-es="Sitio web de muestra por [Tu Nombre] · ¿Quieres uno así para tu negocio? <a href='#visit'>Hablemos</a>"></div>

<header>
  <nav class="wrap">
    <a href="#" class="logo">Café <span>Tepuy</span></a>
    <div class="nav-links">
      <a href="#menu" data-en="Menu" data-es="Menú"></a>
      <a href="#about" data-en="Our story" data-es="Nuestra historia"></a>
      <a href="#reviews" data-en="Reviews" data-es="Reseñas"></a>
      <a href="#visit" data-en="Visit" data-es="Visítanos"></a>
    </div>
    <button class="lang" id="langBtn" aria-label="Switch language">ES</button>
  </nav>
</header>

<main class="wrap">
  <div class="hero">
    <div>
      <div class="eyebrow" data-en="Venezuelan café · Doral, FL" data-es="Café venezolano · Doral, FL"></div>
      <h1 data-en="Arepas made by hand, every morning." data-es="Arepas hechas a mano, cada mañana."></h1>
      <p data-en="Fresh arepas, cachapas and the best café con leche on this side of the 836. Breakfast, lunch, and catering for your office." data-es="Arepas, cachapas y el mejor café con leche de este lado de la 836. Desayuno, almuerzo y catering para tu oficina."></p>
      <div class="ctas">
        <a class="btn btn-primary" href="#visit" data-en="Order for pickup" data-es="Ordena para recoger"></a>
        <a class="btn btn-ghost" href="#menu" data-en="See the menu" data-es="Ver el menú"></a>
      </div>
    </div>
    <div class="hero-art" role="img" aria-label="Photo placeholder">
      <div class="tag"><strong data-en="Today's special" data-es="Especial del día"></strong><span data-en="Pabellón arepa + café, $12.99" data-es="Arepa pabellón + café, $12.99"></span></div>
    </div>
  </div>

  <div class="strip">
    <div><strong data-en="Open 7 days" data-es="Abierto 7 días"></strong><span data-en="7am – 4pm" data-es="7am – 4pm"></span></div>
    <div><strong data-en="Catering" data-es="Catering"></strong><span data-en="Office breakfasts from 10 people" data-es="Desayunos de oficina desde 10 personas"></span></div>
    <div><strong data-en="Free parking" data-es="Estacionamiento gratis"></strong><span data-en="Right in front of the door" data-es="Justo frente a la puerta"></span></div>
  </div>

  <section id="menu">
    <div class="section-head">
      <h2 data-en="Customer favorites" data-es="Los favoritos"></h2>
      <p data-en="Swap these placeholders for the business's own food photos. Real photos always beat stock." data-es="Cambia estos espacios por fotos reales de la comida. Las fotos reales siempre ganan."></p>
    </div>
    <div class="menu">
      <div class="item"><div class="ph">PHOTO</div><div class="body"><h3><b data-en="Reina Pepiada" data-es="Reina Pepiada"></b><span>$9.50</span></h3><p data-en="Chicken and avocado salad in a crispy arepa." data-es="Ensalada de pollo y aguacate en arepa crujiente."></p></div></div>
      <div class="item"><div class="ph">PHOTO</div><div class="body"><h3><b data-en="Cachapa con queso" data-es="Cachapa con queso"></b><span>$11.00</span></h3><p data-en="Sweet corn pancake folded over queso de mano." data-es="Cachapa de maíz dulce con queso de mano."></p></div></div>
      <div class="item"><div class="ph">PHOTO</div><div class="body"><h3><b data-en="Pabellón" data-es="Pabellón"></b><span>$12.50</span></h3><p data-en="Shredded beef, black beans, plantain, cheese." data-es="Carne mechada, caraotas, tajadas y queso."></p></div></div>
      <div class="item"><div class="ph">PHOTO</div><div class="body"><h3><b data-en="Tequeños (6)" data-es="Tequeños (6)"></b><span>$7.00</span></h3><p data-en="Golden cheese sticks. Dangerously addictive." data-es="Palitos de queso dorados. Peligrosamente adictivos."></p></div></div>
      <div class="item"><div class="ph">PHOTO</div><div class="body"><h3><b data-en="Café con leche" data-es="Café con leche"></b><span>$3.75</span></h3><p data-en="Strong, creamy, made the way it should be." data-es="Fuerte, cremoso, como debe ser."></p></div></div>
      <div class="item"><div class="ph">PHOTO</div><div class="body"><h3><b data-en="Golfeados" data-es="Golfeados"></b><span>$4.25</span></h3><p data-en="Sweet anise rolls with papelón and cheese." data-es="Pan dulce de anís con papelón y queso."></p></div></div>
    </div>
  </section>

  <section id="about">
    <div class="about">
      <div class="hero-art" style="aspect-ratio:1" role="img" aria-label="Photo placeholder"></div>
      <div>
        <div class="eyebrow" data-en="Our story" data-es="Nuestra historia"></div>
        <p class="quote" data-en="&ldquo;We wanted Doral to taste like Sunday breakfast at grandma's house.&rdquo;" data-es="&ldquo;Queríamos que Doral supiera a desayuno de domingo en casa de la abuela.&rdquo;"></p>
        <p data-en="Replace this with the owner's real story, in their words. Two short paragraphs: where they're from, why they opened, what they're proud of. This section is what turns visitors into regulars." data-es="Reemplaza esto con la historia real del dueño, en sus palabras. Dos párrafos cortos: de dónde son, por qué abrieron y de qué están orgullosos. Esta sección convierte visitantes en clientes fijos."></p>
      </div>
    </div>
  </section>

  <section id="reviews">
    <div class="section-head">
      <h2 data-en="What people say" data-es="Lo que dicen"></h2>
      <p data-en="Placeholder reviews. Paste in real Google reviews (with permission) before going live." data-es="Reseñas de muestra. Pega reseñas reales de Google (con permiso) antes de publicar."></p>
    </div>
    <div class="reviews">
      <div class="review"><div class="stars">★★★★★</div><p data-en="&ldquo;Sample review: the kind of line a happy customer leaves.&rdquo;" data-es="&ldquo;Reseña de muestra: lo que deja un cliente feliz.&rdquo;"></p><span>— Google review</span></div>
      <div class="review"><div class="stars">★★★★★</div><p data-en="&ldquo;Sample review: mention the food, the service, the vibe.&rdquo;" data-es="&ldquo;Reseña de muestra: la comida, el servicio, el ambiente.&rdquo;"></p><span>— Google review</span></div>
      <div class="review"><div class="stars">★★★★★</div><p data-en="&ldquo;Sample review: keep these short and specific.&rdquo;" data-es="&ldquo;Reseña de muestra: cortas y específicas.&rdquo;"></p><span>— Google review</span></div>
    </div>
  </section>

  <section id="visit">
    <div class="visit">
      <div>
        <h2 data-en="Come say hola." data-es="Ven a saludarnos."></h2>
        <ul>
          <li data-en="📍 [Address], Doral, FL" data-es="📍 [Dirección], Doral, FL"></li>
          <li data-en="📞 [Phone number]" data-es="📞 [Teléfono]"></li>
          <li data-en="📸 @[instagram]" data-es="📸 @[instagram]"></li>
        </ul>
        <a class="btn btn-primary" href="#" data-en="Get directions" data-es="Cómo llegar"></a>
      </div>
      <div class="hours">
        <div><span data-en="Mon – Fri" data-es="Lun – Vie"></span><span>7:00am – 4:00pm</span></div>
        <div><span data-en="Saturday" data-es="Sábado"></span><span>8:00am – 4:00pm</span></div>
        <div><span data-en="Sunday" data-es="Domingo"></span><span>8:00am – 2:00pm</span></div>
      </div>
    </div>
  </section>
</main>

<footer class="wrap">
  <span>© Café Tepuy · Doral, FL</span>
  <span data-en="Website by [Your Name]" data-es="Sitio web por [Tu Nombre]"></span>
</footer>

<a class="float-cta" href="#" data-en="💬 WhatsApp us" data-es="💬 Escríbenos"></a>

<script>
  var lang = 'en';
  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function (el) {
      el.innerHTML = el.getAttribute('data-' + lang);
    });
    document.getElementById('langBtn').textContent = lang === 'en' ? 'ES' : 'EN';
  }
  document.getElementById('langBtn').addEventListener('click', function () {
    lang = lang === 'en' ? 'es' : 'en';
    render();
  });
  render();
</script>
</body>
</html>
